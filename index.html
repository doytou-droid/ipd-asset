<script>
/* ============================================================

const ROLES={

const RES=[["bld","อาคาร"],["flr","ชั้น"],["room","ห้อง"],["cat","หมวดครุภัณฑ์"]];
const ACT=[["v","ดู"],["a","เพิ่ม"],["e","แก้ไข"],["d","ลบ"]];
const DEFAULT_PERMS={
 superadmin:{bld:{v:1,a:1,e:1,d:1},flr:{v:1,a:1,e:1,d:1},room:{v:1,a:1,e:1,d:1},cat:{v:1,a:1,e:1,d:1}},

 catadmin:{bld:{v:1,a:0,e:0,d:0},flr:{v:1,a:0,e:0,d:0},room:{v:1,a:0,e:0,d:0},cat:{v:1,a:1,e:1,d:1}},
 manager:{bld:{v:1,a:0,e:0,d:0},flr:{v:1,a:0,e:1,d:0},room:{v:1,a:1,e:1,d:0},cat:{v:1,a:0,e:0,d:0}},
 staff:{bld:{v:1,a:0,e:0,d:0},flr:{v:1,a:0,e:0,d:0},room:{v:1,a:1,e:1,d:0},cat:{v:1,a:0,e:0,d:0}},
 viewer:{bld:{v:1,a:0,e:0,d:0},flr:{v:1,a:0,e:0,d:0},room:{v:1,a:0,e:0,d:0},cat:{v:1,a:0,e:0,d:0}}};
const STATUS=["ใช้งานปกติ","รอติดตั้ง","ส่งซ่อม","ชำรุด","จำหน่ายแล้ว"];

 "12":["ตู้แช่","เครื่องทำน้ำร้อน-น้ำเย็น","รถเข็นอาหาร","เครื่องซักผ้า"]};
const MENU=[
 ["dash","ภาพรวม (Dashboard)",()=>true],
 ["plan","ผังอาคาร/ปักหมุดห้อง",()=>true],
 ["floor","มุมมองตามชั้น",()=>true],
 ["dept","ตามหน่วยงาน",()=>true],
 ["asset","ตามครุภัณฑ์",()=>true],
 ["master","ข้อมูลหลัก (อาคาร/ชั้น/ห้อง/หน่วยงาน/หมวด)",()=>canAnyMaster()],
 ["print","ฟอร์ม A4",()=>true],
 ["log","ประวัติการใช้งาน",()=>["superadmin","bldadmin","catadmin"].includes(RL())],
 ["user","ผู้ใช้งาน",()=>isSuper()],
 ["perm","สิทธิ์การเข้าถึง",()=>isSuper()],
 ["data","สำรอง/นำเข้าข้อมูล",()=>["superadmin","bldadmin"].includes(RL())]];

/* ============================================================
   ส่วนที่ 2 : ที่เก็บไฟล์ (IndexedDB) + ตัวช่วยรูป/PDF
   ============================================================ */
let _idb=null, FC={};
function idb(){return new Promise((res,rej)=>{if(_idb)return res(_idb);
 const q=indexedDB.open("hosp_asset_files2",1);
 q.onupgradeneeded=e=>{if(!e.target.result.objectStoreNames.contains("f"))e.target.result.createObjectStore("f")};
 q.onsuccess=e=>{_idb=e.target.result;res(_idb)};q.onerror=rej;});}
async function putFile(data){const id=uid();const d=await idb();
 await new Promise((res,rej)=>{const t=d.transaction("f","readwrite");t.objectStore("f").put(data,id);t.oncomplete=res;t.onerror=rej;});
 FC[id]=data;return "f:"+id;}
async function dropFile(ref){if(!ref||!ref.startsWith("f:"))return;const id=ref.slice(2);delete FC[id];
 const d=await idb();d.transaction("f","readwrite").objectStore("f").delete(id);}
function loadFiles(){return new Promise(async res=>{const d=await idb();
 const c=d.transaction("f","readonly").objectStore("f").openCursor();
 c.onsuccess=e=>{const cur=e.target.result;if(cur){FC[cur.key]=cur.value;cur.continue()}else res()};c.onerror=()=>res();});}
function IMG(ref){if(!ref)return"";return ref.startsWith("f:")?(FC[ref.slice(2)]||""):ref;}
function shrink(file,max=1280,q=.72){return new Promise((res,rej)=>{
 const r=new FileReader();
 r.onerror=()=>rej(new Error("อ่านไฟล์ไม่ได้"));
 r.onload=e=>{const im=new Image();
  im.onerror=()=>rej(new Error("เบราว์เซอร์เปิดไฟล์ภาพนี้ไม่ได้ (เช่น .HEIC จาก iPhone) กรุณาบันทึกเป็น JPG ก่อน"));
  im.onload=()=>{let w=im.width,h=im.height;
   if(w>max||h>max){const s=Math.min(max/w,max/h);w=Math.round(w*s);h=Math.round(h*s);}
   const c=document.createElement("canvas");c.width=w;c.height=h;
   c.getContext("2d").drawImage(im,0,0,w,h);res(c.toDataURL("image/jpeg",q));};
  im.src=e.target.result;};
 r.readAsDataURL(file);});}
function readAs(file){return new Promise(res=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.readAsDataURL(file);});}
function b2blob(d){const[h,b]=d.split(",");const m=h.match(/:(.*?);/)[1];const s=atob(b);
 const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return new Blob([u],{type:m});}
function openRef(ref){const d=IMG(ref);if(!d)return alert("ไม่พบไฟล์");window.open(URL.createObjectURL(b2blob(d)),"_blank");}
function loadPdfJs(){return new Promise((res,rej)=>{
 if(window.pdfjsLib)return res(window.pdfjsLib);
 const s=document.createElement("script");
 s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
 s.onload=()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc=
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";res(window.pdfjsLib);};
 s.onerror=()=>rej(new Error("โหลดตัวอ่าน PDF ไม่ได้ (ต้องเชื่อมอินเทอร์เน็ต)"));
 document.head.appendChild(s);});}
async function pdfToImg(file,max){
 const lib=await loadPdfJs();
 const pdf=await lib.getDocument({data:await file.arrayBuffer()}).promise;
 const pg=await pdf.getPage(1);
 let vp=pg.getViewport({scale:1});
 vp=pg.getViewport({scale:Math.min(max/vp.width,max/vp.height,3)});
 const c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;
 await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
 return c.toDataURL("image/jpeg",.8);}
function pickImg(max,allowPdf){return new Promise(res=>{
 const i=document.createElement("input");i.type="file";
 i.accept=allowPdf?"image/*,application/pdf":"image/*";
 i.onchange=async()=>{const f=i.files[0];if(!f)return res(null);
  toast("กำลังประมวลผลไฟล์...");
  try{res(f.type==="application/pdf"?await pdfToImg(f,max||1600):await shrink(f,max||1600,.75));}
  catch(e){alert("อัปโหลดไม่สำเร็จ\n\n"+e.message);res(null);}};
 i.click();});}
function toast(msg){
 let t=document.getElementById("tst");
 if(!t){t=document.createElement("div");t.id="tst";
  t.style.cssText="position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:24px;font-size:13px;z-index:999;box-shadow:0 6px 20px rgba(0,0,0,.35)";
  document.body.appendChild(t);}
 t.textContent=msg;t.style.display="block";
 clearTimeout(window._tt);window._tt=setTimeout(()=>t.style.display="none",2600);}

/* ============================================================

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function save(){localStorage.setItem(K,JSON.stringify(DB));}
function esc(s){return(s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function money(n){return(+n||0).toLocaleString("th-TH",{minimumFractionDigits:2});}
function log(a,d){DB.logs.unshift({t:new Date().toISOString(),u:ME?ME.em:"system",act:a,detail:d});
 if(DB.logs.length>3000)DB.logs.pop();}
function load(){

 if(r){DB=JSON.parse(r);if(!DB.perms)DB.perms=JSON.parse(JSON.stringify(DEFAULT_PERMS));return;}

 DB.cats=[["01","ครุภัณฑ์สำนักงาน"],["02","ครุภัณฑ์การศึกษา"],["03","ครุภัณฑ์ยานพาหนะและขนส่ง"],

   ============================================================ */
const RL=()=>ME.role;
const isSuper=()=>RL()==="superadmin";
function inB(bid){return isSuper()||!ME.scopeB.length||ME.scopeB.includes(bid);}
function inF(fid){return isSuper()||!ME.scopeF.length||ME.scopeF.includes(fid);}
function inC(c){return isSuper()||!ME.scopeC.length||ME.scopeC.includes(c);}
function pv(res,act){const p=DB.perms[ME.role];return !!(p&&p[res]&&p[res][act]);}
function canBld(id,act){return pv("bld",act)&&inB(id);}
function canFlrP(f,act){return pv("flr",act)&&inB(f.bid);}
function canRoomP(r,act){return pv("room",act)&&inB(r.bid)&&inF(r.fid);}
function canAsset(room,cat,act){
 return (pv("room",act)&&inB(room.bid)&&inF(room.fid))||(pv("cat",act)&&inC(cat));}
function canAddAsset(r){return (pv("room","a")&&inB(r.bid)&&inF(r.fid))||pv("cat","a");}
function canPin(f){return pv("room","e")&&inB(f.bid)&&inF(f.id);}
function canDept(){return isSuper()||RL()==="bldadmin";}
function canAnyMaster(){return ["a","e","d"].some(x=>pv("bld",x)||pv("flr",x)||pv("room",x)||pv("cat",x))||canDept();}
function visRooms(){return DB.rooms.filter(r=>canRoomP(r,"v"));}
function visAssets(){return DB.assets.filter(a=>{const r=RM(a.room);return r.id&&canAsset(r,a.cat,"v");});}

async function upBldImg(id,key){const d=await pickImg(1800,true);if(!d)return;
 const b=B(id);await dropFile(b[key]);b[key]=await putFile(d);
 log("plan","อัปเดตรูป "+key+" อาคาร "+b.code);save();vPlan();toast("อัปโหลดสำเร็จ");}
async function upFloorImg(id,key){const d=await pickImg(1800,true);if(!d)return;
 const f=FL(id);await dropFile(f[key]);f[key]=await putFile(d);
 log("plan","อัปเดตรูป "+key+" "+f.name);save();vPlan();toast("อัปโหลดผังสำเร็จ — กดปุ่ม ② เพื่อเริ่มปักหมุด");}
function clickPlan(e){
 if(!PL.pin)return;
 if(!PL.room)return alert("กรุณาเลือกห้องที่จะปักหมุดจากช่องด้านบนก่อนครับ");
 const img=document.querySelector("#pw img");if(!img)return;
 const w=img.getBoundingClientRect();
 let x=((e.clientX-w.left)/w.width)*100, y=((e.clientY-w.top)/w.height)*100;
 x=Math.max(0,Math.min(100,x)); y=Math.max(0,Math.min(100,y));
 const r=RM(PL.room);
 r.x=+x.toFixed(2); r.y=+y.toFixed(2);
 log("pin","ปักหมุดห้อง "+r.code+" ที่ "+r.x+"%, "+r.y+"%");save();
 const nx=DB.rooms.filter(z=>z.fid===PL.fid).find(z=>z.x==null);
 PL.room=nx?nx.id:"";
 vPlan();
 toast(nx?("บันทึก "+r.code+" แล้ว → ห้องถัดไป: "+nx.code):"ปักหมุดครบทุกห้องในชั้นนี้แล้ว");}
function rmPin(id){const r=RM(id);r.x=null;r.y=null;
 log("pin","ลบหมุดห้อง "+r.code);save();vPlan();toast("ลบหมุด "+r.code+" แล้ว");}

  return `<h3 style="margin:12px 0 8px;color:#1e3a8a">${esc(b.code)} — ${esc(b.name)}</h3>`+fls.map(f=>{

   const body=rms.map(r=>{

     <div class="noprint" style="display:flex;gap:5px">
      <button class="btn-s btn-sm" onclick="roomView('${r.id}')">รายละเอียด/ภาพห้อง</button>
      ${canAddAsset(r)?`<button class="btn btn-sm" onclick="assetForm('${r.id}')">+ ครุภัณฑ์</button>`:""}
      <button class="btn-s btn-sm" onclick="printRoom('${r.id}')">ฟอร์ม A4</button></div></div>
     ${as.length?assetTable(as,r):'<div style="color:#94a3b8;font-size:12px;margin-top:6px">ยังไม่มีครุภัณฑ์ในห้องนี้</div>'}</div>`;

async function addPhoto(id){const ang=ph_ang.value;const d=await pickImg(1280);if(!d)return;

 fillPreset();}
function fillPreset(){dl_name.innerHTML=(PRESET[f_cat.value]||[]).map(n=>`<option>${n}</option>`).join("");}
async function pickAssetImg(el){const f=el.files[0];if(!f)return;
 try{const d=await shrink(f,1280,.72);TMP.img=await putFile(d);prev.src=d;prev.style.display="block";DIRTY=true;}
 catch(e){alert("อัปโหลดรูปไม่สำเร็จ\n\n"+e.message);}}
async function pickPdf(el){const f=el.files[0];if(!f)return;
 if(f.size>3*1024*1024)return alert("ไฟล์ใหญ่เกิน 3 MB กรุณาบีบอัดไฟล์ PDF ก่อน");
 const d=await readAs(f);TMP.pdf={ref:await putFile(d),name:f.name,size:f.size};
 pdfinfo.textContent=f.name+" ("+Math.round(f.size/1024)+" KB) แนบแล้ว";DIRTY=true;}
function saveAsset(id){
 const room=RM(f_room.value);
 const act=id?"e":"a";
 if(!canAsset(room,f_cat.value,act))return alert("คุณไม่มีสิทธิ์บันทึกในขอบเขตนี้");
 if(!f_name.value.trim())return alert("กรุณาระบุชื่อครุภัณฑ์");
 const o={room:room.id,cat:f_cat.value,name:f_name.value.trim(),no:f_no.value,sn:f_sn.value,qty:+f_qty.value||1,
  brand:f_brand.value,model:f_model.value,price:+f_price.value||0,vendor:f_vendor.value,buy:f_buy.value,
  war:f_war.value,rdept:f_rdept.value,status:f_st.value,budget:f_bud.value,spec:f_spec.value,note:f_note.value,
  img:TMP.img,pdf:TMP.pdf};
 if(id){Object.assign(DB.assets.find(x=>x.id===id),o);log("edit_asset","แก้ไข "+o.name+" ("+o.no+")");}
 else{o.id=uid();o.created=new Date().toISOString();o.by=ME.em;DB.assets.push(o);log("add_asset","เพิ่ม "+o.name+" x"+o.qty+" @"+room.code);}
 save();DIRTY=false;mc();go(TAB);}
function delAsset(id){const a=DB.assets.find(x=>x.id===id),r=RM(a.room);
 if(!canAsset(r,a.cat,"d"))return alert("ไม่มีสิทธิ์ลบ");
 if(!confirm("ยืนยันลบ "+a.name+" ?"))return;
 dropFile(a.img);if(a.pdf)dropFile(a.pdf.ref);
 DB.assets=DB.assets.filter(x=>x.id!==id);log("del_asset","ลบ "+a.name+" ("+a.no+")");save();go(TAB);}

  ${L("หมดประกัน",a.war)}${L("แหล่งงบประมาณ",a.budget)}${L("หน่วยงานผู้รับผิดชอบ",DP(a.rdept).name)}${L("สถานะ",a.status)}

 view.innerHTML=`<div class="card"><b>ตั้งค่าสิทธิ์การเข้าถึงตามระดับผู้ใช้งาน</b>
  <div class="hint" style="margin:10px 0">เลือกระดับสิทธิ์ที่ต้องการตั้งค่า แล้วติ๊กถูกช่องที่อนุญาต — ถ้าไม่ติ๊ก แปลว่าทำสิ่งนั้นไม่ได้เลยในทรัพยากรนั้น<br>
  ขอบเขต (อาคาร/ชั้น/หมวดใดบ้าง) กำหนดแยกต่างหากที่หน้า "ผู้ใช้งาน" ของผู้ใช้แต่ละคน · ครุภัณฑ์จะแก้ไข/เพิ่ม/ลบได้ ถ้ามีสิทธิ์ด้าน "ห้อง" (ในขอบเขตอาคาร/ชั้น) หรือ "หมวดครุภัณฑ์" (ในขอบเขตหมวด) อย่างใดอย่างหนึ่ง</div>
  <div class="tabs">${Object.keys(ROLES).filter(r=>r!=="superadmin").map(r=>`<button class="${PT===r?"on":""}" onclick="PT='${r}';vPerm()">${ROLES[r]}</button>`).join("")}</div>
  <table><tr><th>ทรัพยากร</th>${ACT.map(a=>`<th style="text-align:center">${a[1]}</th>`).join("")}</tr>
  ${RES.map(r=>`<tr><td><b>${r[1]}</b></td>${ACT.map(a=>`<td style="text-align:center">
   <input type="checkbox" style="width:auto" id="pm_${r[0]}_${a[0]}" ${DB.perms[PT][r[0]][a[0]]?"checked":""}></td>`).join("")}</tr>`).join("")}
  </table>
  <div style="margin-top:12px"><button class="btn" onclick="savePerm()">บันทึกสิทธิ์ของ ${ROLES[PT]}</button>
  <button class="btn-s" onclick="resetPerm()">รีเซ็ตเป็นค่าเริ่มต้นที่แนะนำ</button></div></div>
  <div class="card"><b>ผู้ดูแลระบบสูงสุด (Superadmin)</b>
   <p style="font-size:12px;color:#64748b;margin-top:6px">มีสิทธิ์ทุกอย่างเสมอ ไม่สามารถลดสิทธิ์ได้ เพื่อป้องกันการล็อกตัวเองออกจากระบบ</p></div>`;}
function savePerm(){
 RES.forEach(r=>ACT.forEach(a=>{DB.perms[PT][r[0]][a[0]]=document.getElementById("pm_"+r[0]+"_"+a[0]).checked?1:0;}));
 log("perm","แก้ไขสิทธิ์ระดับ "+ROLES[PT]);save();toast("บันทึกสิทธิ์เรียบร้อย");vPerm();}
function resetPerm(){
 if(!confirm("รีเซ็ตสิทธิ์ของ "+ROLES[PT]+" กลับเป็นค่าเริ่มต้นที่แนะนำ?"))return;
 DB.perms[PT]=JSON.parse(JSON.stringify(DEFAULT_PERMS[PT]));
 log("perm","รีเซ็ตสิทธิ์ระดับ "+ROLES[PT]+" เป็นค่าเริ่มต้น");save();vPerm();}

/* ============================================================
   ส่วนที่ 14 : Log / สำรอง-นำเข้าข้อมูล
   ============================================================ */
function vLog(){
 view.innerHTML=`<div class="card"><b>ประวัติการใช้งาน (Audit Log) — ${DB.logs.length} รายการ</b>
  <button class="btn-s btn-sm noprint" style="float:right" onclick="expCsv('log')">ส่งออก CSV</button>
  <table style="margin-top:10px"><tr><th>วัน-เวลา</th><th>ผู้ใช้</th><th>การกระทำ</th><th>รายละเอียด</th></tr>
  ${DB.logs.slice(0,500).map(l=>`<tr><td>${new Date(l.t).toLocaleString("th-TH")}</td><td>${esc(l.u)}</td>
   <td><span class="chip">${esc(l.act)}</span></td><td>${esc(l.detail)}</td></tr>`).join("")}</table></div>`;}
function vData(){
 const used=(new Blob([JSON.stringify(DB)]).size/1024/1024).toFixed(2);
 const files=Object.keys(FC).length;
 const fsz=(Object.values(FC).reduce((s,v)=>s+v.length,0)/1024/1024).toFixed(2);
 view.innerHTML=`<div class="card"><b>สำรอง / นำเข้า / สถานะพื้นที่</b>
  <p style="color:#64748b;font-size:12px;margin:8px 0">ข้อมูลข้อความใช้ไป ${used} MB (localStorage) ·
   ไฟล์รูป/PDF ${files} ไฟล์ ≈ ${fsz} MB (IndexedDB) · แนะนำสำรองเป็นไฟล์ JSON ทุกครั้งหลังกรอกข้อมูลจำนวนมาก</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
   <button class="btn" onclick="expJson(false)">สำรองข้อมูล (JSON เฉพาะข้อความ · ไฟล์เล็ก)</button>
   <button class="btn-g" onclick="expJson(true)">สำรองแบบเต็ม (รวมรูปและ PDF · ไฟล์ใหญ่)</button>
   <button class="btn-s" onclick="expCsv('asset')">ส่งออกครุภัณฑ์ (CSV เปิดด้วย Excel)</button>
   <button class="btn-s" onclick="imp.click()">นำเข้าไฟล์สำรอง</button>
   ${isSuper()?`<button class="btn-r" onclick="if(confirm('ล้างข้อมูลทั้งหมดและเริ่มใหม่?')){localStorage.removeItem('${K}');indexedDB.deleteDatabase('hosp_asset_files2');location.reload()}">รีเซ็ตระบบ</button>`:""}
  </div><input type="file" id="imp" accept=".json" class="hidden"></div>`;
 imp.onchange=e=>{const f=e.target.files[0];const r=new FileReader();
  r.onload=async ev=>{try{const j=JSON.parse(ev.target.result);
   if(j.files){for(const[k,v]of Object.entries(j.files)){const d=await idb();
    d.transaction("f","readwrite").objectStore("f").put(v,k);FC[k]=v;}delete j.files;}
   if(!j.perms)j.perms=JSON.parse(JSON.stringify(DEFAULT_PERMS));
   DB=j;save();alert("นำเข้าสำเร็จ");location.reload();}catch(x){alert("ไฟล์ไม่ถูกต้อง");}};
  r.readAsText(f);};}
function dl(n,c,t){const b=new Blob(["\ufeff"+c],{type:t});const u=URL.createObjectURL(b);
 const a=document.createElement("a");a.href=u;a.download=n;a.click();URL.revokeObjectURL(u);}
function expJson(full){
 const o=JSON.parse(JSON.stringify(DB));if(full)o.files=FC;
 dl("asset_backup_"+(full?"full_":"")+new Date().toISOString().slice(0,10)+".json",JSON.stringify(o),"application/json");
 log("backup","สำรองข้อมูล"+(full?"แบบเต็ม":""));save();}
function expCsv(kind){
 let rows;
 if(kind==="log")rows=[["วันเวลา","ผู้ใช้","การกระทำ","รายละเอียด"],
  ...DB.logs.map(l=>[new Date(l.t).toLocaleString("th-TH"),l.u,l.act,l.detail])];
 else{const src=(window._rows&&window._rows.length?window._rows:visAssets().map(a=>({a,r:RM(a.room)})));
  rows=[["อาคาร","ชั้น","รหัสห้อง","ชื่อห้อง","หน่วยงานห้อง","รหัสหมวด","ชื่อหมวด","เลขครุภัณฑ์","Serial","รายการ","คุณลักษณะ",
   "ยี่ห้อ","รุ่น","จำนวน","ราคาต่อหน่วย","มูลค่ารวม","ผู้ขาย","วันที่ซื้อ","หมดประกัน","แหล่งงบ","หน่วยงานผู้รับผิดชอบ","สถานะ","หมายเหตุ","ไฟล์ PDF"],
   ...src.map(({a,r})=>[B(r.bid).name,FL(r.fid).no,r.code,r.name,DP(r.dept).name,a.cat,CT(a.cat).name,a.no,a.sn,a.name,a.spec,
    a.brand,a.model,a.qty,a.price,(+a.price||0)*(+a.qty||1),a.vendor,a.buy,a.war,a.budget,DP(a.rdept).name,a.status,a.note,a.pdf?a.pdf.name:""])];}
 dl("export_"+kind+".csv",rows.map(r=>r.map(c=>`"${(c==null?"":String(c)).replace(/"/g,'""')}"`).join(",")).join("\n"),"text/csv;charset=utf-8");}

/* ============================================================
   ส่วนที่ 15 : Modal + ยืนยันก่อนปิดหน้าต่างที่มีข้อมูลค้าง
   ============================================================ */
function mo(h){
 DIRTY=false;
 modal.innerHTML=`<div class="modal" onclick="if(event.target===this)mc()"><div class="box">${h}</div></div>`;
 modal.querySelectorAll("input,select,textarea").forEach(el=>{
  if(el.type==="file")return;
  el.addEventListener("input",()=>DIRTY=true);
  el.addEventListener("change",()=>DIRTY=true);
 });}
function mc(){
 if(DIRTY&&!confirm("มีข้อมูลที่กรอกไว้ยังไม่ได้บันทึก ต้องการปิดหน้าต่างนี้หรือไม่?"))return;
 DIRTY=false;modal.innerHTML="";}

/* ============================================================
   ส่วนที่ 16 : เริ่มระบบ
   ============================================================ */
(async function boot(){
 load();await loadFiles();
 const s=sessionStorage.getItem("hosp_me");
 if(s){const u=DB.users.find(x=>x.em===s);if(u){ME=u;start();}}
})();
</script>
</body>
</html>
