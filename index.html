function shrink(file,max=1280,q=.72){return new Promise((res,rej)=>{
 const r=new FileReader();r.onerror=()=>rej(new Error("อ่านไฟล์ไม่ได้"));
 r.onload=e=>{const im=new Image();
  im.onerror=()=>rej(new Error("เบราว์เซอร์เปิดไฟล์ภาพนี้ไม่ได้ กรุณาบันทึกเป็น JPG ก่อน"));
  im.onload=()=>{let w=im.width,h=im.height;
   if(w>max||h>max){const s=Math.min(max/w,max/h);w=Math.round(w*s);h=Math.round(h*s);}
   const c=document.createElement("canvas");c.width=w;c.height=h;
   c.getContext("2d").drawImage(im,0,0,w,h);res(c.toDataURL("image/jpeg",q));};
  im.src=e.target.result;};
 r.readAsDataURL(file);});}
function readAs(file){return new Promise((res,rej)=>{const r=new FileReader();
 r.onerror=()=>rej(new Error("อ่านไฟล์ไม่ได้"));r.onload=e=>res(e.target.result);r.readAsDataURL(file);});}
function loadPdfJs(){return new Promise((res,rej)=>{
 if(window.pdfjsLib)return res(window.pdfjsLib);
 const s=document.createElement("script");
 s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
 s.onload=()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc=
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";res(window.pdfjsLib);};
 s.onerror=()=>rej(new Error("โหลดตัวอ่าน PDF ไม่ได้"));document.head.appendChild(s);});}
async function pdfToImg(file,max){
 const lib=await loadPdfJs();
 const pdf=await lib.getDocument({data:await file.arrayBuffer()}).promise;
 const pg=await pdf.getPage(1);let vp=pg.getViewport({scale:1});
 vp=pg.getViewport({scale:Math.min(max/vp.width,max/vp.height,3)});
 const c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;
 await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
 return c.toDataURL("image/jpeg",.8);}

  document.body.appendChild(t);}
 t.textContent=msg;t.style.display="block";
 clearTimeout(window._tt);window._tt=setTimeout(()=>t.style.display="none",2600);}

async function loadAllOnce(){
 const [bld,flr,rm,dp,ct,as,us] = await Promise.all([
  dbf.collection("buildings").get(),dbf.collection("floors").get(),dbf.collection("rooms").get(),
  dbf.collection("depts").get(),dbf.collection("cats").get(),dbf.collection("assets").get(),dbf.collection("users").get()]);
 DB.buildings=bld.docs.map(d=>({id:d.id,...d.data()}));
 DB.floors=flr.docs.map(d=>({id:d.id,...d.data()}));
 DB.rooms=rm.docs.map(d=>({id:d.id,...d.data()}));
 DB.depts=dp.docs.map(d=>({id:d.id,...d.data()}));
 DB.cats=ct.docs.map(d=>({id:d.id,code:d.id,...d.data()}));
 DB.assets=as.docs.map(d=>({id:d.id,...d.data()}));
 DB.users=us.docs.map(d=>({id:d.id,...d.data()}));
 const pm=await dbf.collection("perms").get();
 DB.perms={};pm.docs.forEach(d=>DB.perms[d.id]=d.data());
 Object.keys(DEFAULT_PERMS).forEach(r=>{if(!DB.perms[r])DB.perms[r]=DEFAULT_PERMS[r];});
 const lg=await dbf.collection("logs").orderBy("t","desc").limit(500).get();
 DB.logs=lg.docs.map(d=>({id:d.id,...d.data()}));}

function attachListeners(){
 const cols=[["buildings","buildings"],["floors","floors"],["rooms","rooms"],["depts","depts"],
  ["cats","cats"],["assets","assets"],["users","users"],["perms","perms"]];
 cols.forEach(([col,key])=>{
  const unsub=dbf.collection(col).onSnapshot(snap=>{
   if(key==="perms"){const obj={};snap.forEach(d=>obj[d.id]=d.data());
    Object.keys(DEFAULT_PERMS).forEach(r=>{if(!obj[r])obj[r]=DEFAULT_PERMS[r];});DB.perms=obj;}
   else if(key==="cats")DB.cats=snap.docs.map(d=>({id:d.id,code:d.id,...d.data()}));
   else DB[key]=snap.docs.map(d=>({id:d.id,...d.data()}));
   scheduleRerender();
  },err=>console.error(col,err));
  UNSUBS.push(unsub);});
 const unsubLog=dbf.collection("logs").orderBy("t","desc").limit(500).onSnapshot(snap=>{
  DB.logs=snap.docs.map(d=>({id:d.id,...d.data()}));scheduleRerender();});
 UNSUBS.push(unsubLog);}
function detachListeners(){UNSUBS.forEach(u=>u());UNSUBS=[];}
function scheduleRerender(){clearTimeout(rerenderTimer);rerenderTimer=setTimeout(()=>{if(ME)go(TAB);},200);}

const RL=()=>ME.role;
const isSuper=()=>RL()==="superadmin";
function inB(bid){return isSuper()||!ME.scopeB.length||ME.scopeB.includes(bid);}
function inF(fid){return isSuper()||!ME.scopeF.length||ME.scopeF.includes(fid);}
function inC(c){return isSuper()||!ME.scopeC.length||ME.scopeC.includes(c);}
function pv(res,act){const p=DB.perms[ME.role];return !!(p&&p[res]&&p[res][act]);}
function canBld(id,act){return pv("bld",act)&&inB(id);}
function canFlrP(f,act){return pv("flr",act)&&inB(f.bid);}
function canRoomP(r,act){return pv("room",act)&&inB(r.bid)&&inF(r.fid);}
function canAsset(room,cat,act){return (pv("room",act)&&inB(room.bid)&&inF(room.fid))||(pv("cat",act)&&inC(cat));}
function canAddAsset(r){return (pv("room","a")&&inB(r.bid)&&inF(r.fid))||pv("cat","a");}
function canPin(f){return pv("room","e")&&inB(f.bid)&&inF(f.id);}
function canDept(){return isSuper()||RL()==="bldadmin";}
function canAnyMaster(){return ["a","e","d"].some(x=>pv("bld",x)||pv("flr",x)||pv("room",x)||pv("cat",x))||canDept();}
function visRooms(){return DB.rooms.filter(r=>canRoomP(r,"v"));}
function visAssets(){return DB.assets.filter(a=>{const r=RM(a.room);return r.id&&canAsset(r,a.cat,"v");});}

function applyDF(){
 DF={b:df_b.value,f:df_f.value,d:df_d.value,c:df_c.value,s:df_s.value,q:df_q.value,d1:df_d1.value,d2:df_d2.value};
 if(DF.f&&FL(DF.f).bid!==DF.b&&DF.b)DF.f="";go(TAB);}
function fRows(){
 let rows=visAssets().map(a=>({a,r:RM(a.room)}));rows=rows.filter(x=>x.r.id);
 if(DF.b)rows=rows.filter(x=>x.r.bid===DF.b);
 if(DF.f)rows=rows.filter(x=>x.r.fid===DF.f);
 if(DF.d)rows=rows.filter(x=>x.r.dept===DF.d||x.a.rdept===DF.d);
 if(DF.c)rows=rows.filter(x=>x.a.cat===DF.c);
 if(DF.s)rows=rows.filter(x=>x.a.status===DF.s);
 if(DF.d1)rows=rows.filter(x=>x.a.buy&&x.a.buy>=DF.d1);
 if(DF.d2)rows=rows.filter(x=>x.a.buy&&x.a.buy<=DF.d2);
 if(DF.q){const q=DF.q.toLowerCase();
  rows=rows.filter(x=>[x.a.name,x.a.no,x.a.sn,x.a.brand,x.a.model,DP(x.a.rdept).name,x.a.vendor,x.a.note].join(" ").toLowerCase().includes(q));}
 window._rows=rows;return rows;}

async function upBldImg(id,key){
 const file=await pickFile(true);if(!file)return;
 try{
  toast("กำลังประมวลผล...");
  const dataUrl=file.type==="application/pdf"?await pdfToImg(file,1800):await shrink(file,1800,.78);
  const b=B(id);
  await dbf.collection("buildings").doc(id).set({[key]:dataUrl},{merge:true});
  log("plan","อัปเดตรูป "+key+" อาคาร "+b.code);toast("อัปโหลดสำเร็จ");
 }catch(e){alert("อัปโหลดไม่สำเร็จ\n\n"+e.message);}}
async function upFloorImg(id,key){
 const file=await pickFile(true);if(!file)return;
 try{
  toast("กำลังประมวลผล...");
  const dataUrl=file.type==="application/pdf"?await pdfToImg(file,1800):await shrink(file,1800,.78);
  const f=FL(id);
  await dbf.collection("floors").doc(id).set({[key]:dataUrl},{merge:true});
  log("plan","อัปเดตรูป "+key+" "+f.name);toast(key==="plan"?"อัปโหลดผังสำเร็จ — กดปุ่ม ② เพื่อเริ่มปักหมุด":"อัปโหลดสำเร็จ");
 }catch(e){alert("อัปโหลดไม่สำเร็จ\n\n"+e.message);}}
async function clickPlan(e){
 if(!PL.pin)return;
 if(!PL.room)return alert("กรุณาเลือกห้องที่จะปักหมุดจากช่องด้านบนก่อนครับ");
 const img=document.querySelector("#pw img");if(!img)return;
 const w=img.getBoundingClientRect();
 let x=((e.clientX-w.left)/w.width)*100,y=((e.clientY-w.top)/w.height)*100;
 x=Math.max(0,Math.min(100,x));y=Math.max(0,Math.min(100,y));
 const roomId=PL.room;
 try{
  await dbf.collection("rooms").doc(roomId).set({x:+x.toFixed(2),y:+y.toFixed(2)},{merge:true});
  const idx=DB.rooms.findIndex(z=>z.id===roomId);if(idx>=0){DB.rooms[idx].x=+x.toFixed(2);DB.rooms[idx].y=+y.toFixed(2);}
  log("pin","ปักหมุดห้อง "+RM(roomId).code);
  const nx=DB.rooms.filter(z=>z.fid===PL.fid).find(z=>z.x==null);
  const code=RM(roomId).code;PL.room=nx?nx.id:"";vPlan();
  toast(nx?("บันทึก "+code+" แล้ว → ห้องถัดไป: "+nx.code):"ปักหมุดครบทุกห้องในชั้นนี้แล้ว");
 }catch(err){alert("บันทึกไม่สำเร็จ: "+err.message);}}
async function rmPin(id){
 try{await dbf.collection("rooms").doc(id).set({x:null,y:null},{merge:true});

  log("pin","ลบหมุดห้อง "+RM(id).code);vPlan();toast("ลบหมุดแล้ว");
 }catch(e){alert("ลบไม่สำเร็จ: "+e.message);}}

async function addPhoto(id){
 const ang=ph_ang.value;const file=await pickFile(false);if(!file)return;
 try{
  toast("กำลังประมวลผล...");
  const url=await shrink(file,1280,.75);
  const r=RM(id);const photos=(r.photos||[]).concat([{angle:ang,url}]);
  await dbf.collection("rooms").doc(id).set({photos},{merge:true});
  const idx=DB.rooms.findIndex(x=>x.id===id);if(idx>=0)DB.rooms[idx].photos=photos;
  log("photo","เพิ่มภาพห้อง "+r.code+" มุม "+ang);toast("เพิ่มรูปสำเร็จ");roomView(id);
 }catch(e){alert("อัปโหลดไม่สำเร็จ\n\n"+e.message);}}
async function delPhoto(id,i){
 if(!confirm("ลบภาพนี้?"))return;
 const r=RM(id);const photos=(r.photos||[]).slice();photos.splice(i,1);
 try{
  await dbf.collection("rooms").doc(id).set({photos},{merge:true});
  const idx=DB.rooms.findIndex(x=>x.id===id);if(idx>=0)DB.rooms[idx].photos=photos;
  log("photo","ลบภาพห้อง "+r.code);roomView(id);
 }catch(e){alert("ลบไม่สำเร็จ: "+e.message);}}

async function pickAssetImg(el){const f=el.files[0];if(!f)return;
 try{toast("กำลังย่อรูป...");const d=await shrink(f,1280,.72);
  TMP.imgData=d;prev.src=d;prev.style.display="block";DIRTY=true;toast("พร้อมบันทึก");}

async function pickPdf(el){const f=el.files[0];if(!f)return;
 if(f.size>3*1024*1024){alert("ไฟล์ใหญ่เกิน 3 MB กรุณาบีบอัดไฟล์ PDF ก่อน");el.value="";return;}
 try{toast("กำลังอ่านไฟล์ PDF...");const d=await readAs(f);
  TMP.pdfObj={dataUrl:d,name:f.name,size:f.size};
  pdfinfo.textContent=f.name+" ("+Math.round(f.size/1024)+" KB) พร้อมบันทึก";DIRTY=true;toast("พร้อมบันทึก");}
 catch(e){alert("อ่านไฟล์ PDF ไม่สำเร็จ");}}
async function saveAsset(id){
 const room=RM(f_room.value);const act=id?"e":"a";
 if(!canAsset(room,f_cat.value,act))return alert("คุณไม่มีสิทธิ์บันทึกในขอบเขตนี้");
 if(!f_name.value.trim())return alert("กรุณาระบุชื่อครุภัณฑ์");
 const o={room:room.id,cat:f_cat.value,name:f_name.value.trim(),no:f_no.value,sn:f_sn.value,qty:+f_qty.value||1,
  brand:f_brand.value,model:f_model.value,price:+f_price.value||0,vendor:f_vendor.value,buy:f_buy.value,
  war:f_war.value,rdept:f_rdept.value,status:f_st.value,budget:f_bud.value,spec:f_spec.value,note:f_note.value,
  img:TMP.imgData||"",pdf:TMP.pdfObj||null};
 try{
  toast("กำลังบันทึก...");
  if(id){await dbf.collection("assets").doc(id).set(o,{merge:true});}
  else{o.created=new Date().toISOString();o.by=ME.em;const ref=await dbf.collection("assets").add(o);o.id=ref.id;DB.assets.push(o);}
  log(id?"edit_asset":"add_asset",(id?"แก้ไข ":"เพิ่ม ")+o.name+" x"+o.qty);
  TMP={};DIRTY=false;mc();go(TAB);toast("บันทึกสำเร็จ");
 }catch(e){alert("บันทึกไม่สำเร็จ\n\n"+e.message);}}
async function delAsset(id){

function catForm(code){
 const c=code?CT(code):{code:"",name:"",sys:false,note:""};
 mo(`<h3>${code?"แก้ไขหมวด":"เพิ่มหมวดครุภัณฑ์ (อื่น ๆ)"}</h3>
  <div class="row g2"><div class="fld"><label>รหัสหมวด</label>
   <input id="c_c" value="${esc(c.code)}" ${code?"disabled":""} placeholder="เช่น 90"></div>
  <div class="fld"><label>ชื่อหมวด</label><input id="c_n" value="${esc(c.name)}"></div></div>
  <div class="fld"><label>หมายเหตุ/คำแนะนำเพิ่มเติมของหมวดนี้ (ไม่บังคับ)</label>
   <textarea id="c_note" rows="2">${esc(c.note)}</textarea></div>
  <div style="text-align:right"><button class="btn-s" onclick="mc()">ยกเลิก</button>
  <button class="btn" onclick="saveCat('${code||""}')">บันทึก</button></div>`);}
async function saveCat(code){
 const nm=c_n.value.trim();if(!nm)return alert("กรอกชื่อหมวด");
 const note=c_note.value;
 try{
  if(code){await dbf.collection("cats").doc(code).set({name:nm,note},{merge:true});CT(code).name=nm;CT(code).note=note;}
  else{const cd=c_c.value.trim();if(!cd)return alert("กรอกรหัสหมวด");if(cd.includes("/"))return alert("รหัสหมวดห้ามมีเครื่องหมาย /");
   if(CT(cd).code)return alert("รหัสนี้มีอยู่แล้ว");
   await dbf.collection("cats").doc(cd).set({name:nm,sys:false,note});DB.cats.push({id:cd,code:cd,name:nm,sys:false,note});}
  log("master","บันทึกหมวด "+nm);DIRTY=false;mc();vMaster();
 }catch(e){alert("บันทึกไม่สำเร็จ: "+e.message);}}
async function delCat(code){
 if(DB.assets.some(a=>a.cat===code))return alert("ลบไม่ได้ — ยังมีครุภัณฑ์อยู่ในหมวดนี้");
 if(!confirm("ยืนยันลบหมวด?"))return;
 try{await dbf.collection("cats").doc(code).delete();DB.cats=DB.cats.filter(c=>c.code!==code);
  log("master","ลบหมวด "+code);vMaster();}catch(e){alert("ลบไม่สำเร็จ: "+e.message);}}

function printBld(bid){

  html+=`<p style="margin-top:8px"><b>${esc(f.name)}</b></p><table>${TH}${tRows(as)}

async function saveUser(i){
 const pick=c=>[...document.querySelectorAll("."+c+":checked")].map(x=>x.value);
 const name=u_nm.value,pos=u_pos.value,dept=u_dept.value,tel=u_tel.value,role=u_rl.value,
  scopeB=pick("ub"),scopeF=pick("uf"),scopeC=pick("uc");
 try{
  if(i>=0){
   const existing=DB.users[i];const o={name,pos,dept,tel,role,scopeB,scopeF,scopeC};
   await dbf.collection("users").doc(existing.id).set(o,{merge:true});Object.assign(existing,o);
   log("user","แก้ไขผู้ใช้ "+existing.em);
  }else{
   const em=u_em.value.trim().toLowerCase(),pw=u_pw.value;
   if(!emailValid(em))return alert("อีเมลต้องลงท้ายด้วย "+EMAIL_DOMAIN);
   if(pw.length<6)return alert("รหัสผ่านต้องอย่างน้อย 6 ตัวอักษร");
   toast("กำลังสร้างบัญชีผู้ใช้...");
   const cred=await secondaryAuth.createUserWithEmailAndPassword(em,pw);
   const o={em,name,pos,dept,tel,role,scopeB,scopeF,scopeC,pending:false};
   await dbf.collection("users").doc(cred.user.uid).set(o);
   await secondaryAuth.signOut();o.id=cred.user.uid;DB.users.push(o);
   log("user","เพิ่มผู้ใช้ "+em+" ("+role+")");
  }
  DIRTY=false;mc();vUser();toast("บันทึกสำเร็จ");
 }catch(e){alert(authErrorMsg(e));}}
async function approveUser(i){
 const u=DB.users[i];try{await dbf.collection("users").doc(u.id).set({pending:false},{merge:true});u.pending=false;
  log("user","ตรวจสอบสมาชิกใหม่ "+u.em);mc();vUser();}catch(e){alert("ไม่สำเร็จ: "+e.message);}}
async function delUser(i){
 const u=DB.users[i];
 if(!confirm("ลบผู้ใช้ "+u.em+" ?"))return;
 try{await dbf.collection("users").doc(u.id).delete();DB.users.splice(i,1);
  log("user","ลบผู้ใช้ "+u.em);vUser();}catch(e){alert("ลบไม่สำเร็จ: "+e.message);}}

  <table><tr><th>ทรัพยากร</th>${ACT.map(a=>`<th style="text-align:center">${a[1]}</th>`).join("")}</tr>
  ${RES.map(r=>`<tr><td><b>${r[1]}</b></td>${ACT.map(a=>`<td style="text-align:center">
   <input type="checkbox" style="width:auto" id="pm_${r[0]}_${a[0]}" ${DB.perms[PT][r[0]][a[0]]?"checked":""}></td>`).join("")}</tr>`).join("")}
  </table>
  <div style="margin-top:12px"><button class="btn" onclick="savePerm()">บันทึกสิทธิ์ของ ${ROLES[PT]}</button>
  <button class="btn-s" onclick="resetPerm()">รีเซ็ตเป็นค่าเริ่มต้นที่แนะนำ</button></div></div>
  <div class="card"><b>ผู้ดูแลระบบสูงสุด (Superadmin)</b>
   <p style="font-size:12px;color:#64748b;margin-top:6px">มีสิทธิ์ทุกอย่างเสมอ ไม่สามารถลดสิทธิ์ได้</p></div>`;}
async function savePerm(){
 const o={};RES.forEach(r=>{o[r[0]]={};ACT.forEach(a=>{o[r[0]][a[0]]=document.getElementById("pm_"+r[0]+"_"+a[0]).checked?1:0;});});
 try{await dbf.collection("perms").doc(PT).set(o);DB.perms[PT]=o;
  log("perm","แก้ไขสิทธิ์ระดับ "+ROLES[PT]);toast("บันทึกสิทธิ์เรียบร้อย");vPerm();
 }catch(e){alert("บันทึกไม่สำเร็จ: "+e.message);}}
async function resetPerm(){
 if(!confirm("รีเซ็ตสิทธิ์ของ "+ROLES[PT]+" กลับเป็นค่าเริ่มต้นที่แนะนำ?"))return;
 try{await dbf.collection("perms").doc(PT).set(DEFAULT_PERMS[PT]);DB.perms[PT]=JSON.parse(JSON.stringify(DEFAULT_PERMS[PT]));
  log("perm","รีเซ็ตสิทธิ์ระดับ "+ROLES[PT]+" เป็นค่าเริ่มต้น");vPerm();
 }catch(e){alert("ไม่สำเร็จ: "+e.message);}}

/* ============================================================
   ส่วนที่ 15 : Log / สำรอง-นำเข้าข้อมูล
   ============================================================ */
function vLog(){
 view.innerHTML=`<div class="card"><b>ประวัติการใช้งาน (Audit Log) — ${DB.logs.length} รายการ</b>
  <button class="btn-s btn-sm noprint" style="float:right" onclick="expCsv('log')">ส่งออก CSV</button>
  <table style="margin-top:10px"><tr><th>วัน-เวลา</th><th>ผู้ใช้</th><th>การกระทำ</th><th>รายละเอียด</th></tr>
  ${DB.logs.slice(0,500).map(l=>`<tr><td>${new Date(l.t).toLocaleString("th-TH")}</td><td>${esc(l.u)}</td>
   <td><span class="chip">${esc(l.act)}</span></td><td>${esc(l.detail)}</td></tr>`).join("")}</table></div>`;}
function vData(){
 view.innerHTML=`<div class="card"><b>สำรอง / นำเข้าข้อมูล</b>
  <p style="color:#64748b;font-size:12px;margin:8px 0">ข้อมูลหลักเก็บอยู่บน Firebase Cloud แล้ว ปุ่มด้านล่างใช้สำรองข้อมูลเป็นไฟล์ JSON ไว้เผื่อฉุกเฉิน</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
   <button class="btn" onclick="expJson()">สำรองข้อมูลปัจจุบัน (JSON)</button>
   <button class="btn-s" onclick="expCsv('asset')">ส่งออกครุภัณฑ์ (CSV เปิดด้วย Excel)</button>
  </div></div>`;}
function dl(n,c,t){const b=new Blob(["\ufeff"+c],{type:t});const u=URL.createObjectURL(b);
 const a=document.createElement("a");a.href=u;a.download=n;a.click();URL.revokeObjectURL(u);}
function expJson(){
 const o={buildings:DB.buildings,floors:DB.floors,rooms:DB.rooms,depts:DB.depts,cats:DB.cats,assets:DB.assets};
 dl("asset_backup_"+new Date().toISOString().slice(0,10)+".json",JSON.stringify(o,null,2),"application/json");
 log("backup","สำรองข้อมูล (JSON)");}
function expCsv(kind){
 let rows;
 if(kind==="log")rows=[["วันเวลา","ผู้ใช้","การกระทำ","รายละเอียด"],
  ...DB.logs.map(l=>[new Date(l.t).toLocaleString("th-TH"),l.u,l.act,l.detail])];
 else{const src=(window._rows&&window._rows.length?window._rows:visAssets().map(a=>({a,r:RM(a.room)})));
  rows=[["อาคาร","ชั้น","รหัสห้อง","ชื่อห้อง","หน่วยงานห้อง","รหัสหมวด","ชื่อหมวด","เลขครุภัณฑ์","Serial","รายการ","คุณลักษณะ",
   "ยี่ห้อ","รุ่น","จำนวน","ราคาต่อหน่วย","มูลค่ารวม","ผู้ขาย","วันที่ซื้อ","หมดประกัน","แหล่งงบ","หน่วยงานผู้รับผิดชอบ","สถานะ","หมายเหตุ","ไฟล์ PDF"],
   ...src.map(({a,r})=>[B(r.bid).name,FL(r.fid).no,r.code,r.name,DP(r.dept).name,a.cat,CT(a.cat).name,a.no,a.sn,a.name,a.spec,
    a.brand,a.model,a.qty,a.price,(+a.price||0)*(+a.qty||1),a.vendor,a.buy,a.war,a.budget,DP(a.rdept).name,a.status,a.note,a.pdf?a.pdf.name:""])];}
 dl("export_"+kind+".csv",rows.map(r=>r.map(c=>`"${(c==null?"":String(c)).replace(/"/g,'""')}"`).join(",")).join("\n"),"text/csv;charset=utf-8");}

/* ============================================================
   ส่วนที่ 16 : Modal + ยืนยันก่อนปิดหน้าต่างที่มีข้อมูลค้าง
   ============================================================ */
function mo(h){
 DIRTY=false;
 modal.innerHTML=`<div class="modal" onclick="if(event.target===this)mc()"><div class="box">${h}</div></div>`;
 modal.querySelectorAll("input,select,textarea").forEach(el=>{
  if(el.type==="file")return;
  el.addEventListener("input",()=>DIRTY=true);
  el.addEventListener("change",()=>DIRTY=true);});}
function mc(){
 if(DIRTY&&!confirm("มีข้อมูลที่กรอกไว้ยังไม่ได้บันทึก ต้องการปิดหน้าต่างนี้หรือไม่?"))return;
 DIRTY=false;modal.innerHTML="";}
</script>
</body>
