function shrink(file,max=1280,q=.72){return new Promise((res,rej)=>{
 const r=new FileReader();r.onerror=()=>rej(new Error("อ่านไฟล์ไม่ได้"));
 r.onload=e=>{const im=new Image();
  im.onerror=()=>rej(new Error("เปิดไฟล์ภาพนี้ไม่ได้"));
  im.onload=()=>{let w=im.width,h=im.height;
   if(w>max||h>max){const s=Math.min(max/w,max/h);w=Math.round(w*s);h=Math.round(h*s);}
   const c=document.createElement("canvas");c.width=w;c.height=h;
   c.getContext("2d").drawImage(im,0,0,w,h);res(c.toDataURL("image/jpeg",q));};
  im.src=e.target.result;};
 r.readAsDataURL(file);});}

function readAs(file){return new Promise((res,rej)=>{const r=new FileReader();
 r.onerror=()=>rej(new Error("อ่านไฟล์ไม่ได้"));r.onload=e=>res(e.target.result);r.readAsDataURL(file);});}

function loadPdfJs(){return new Promise((res,rej)=>{
 if(window.pdfjsLib)return res(window.pdfjsLib);
 const s=document.createElement("script");
 s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
 s.onload=()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc=
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";res(window.pdfjsLib);};
 s.onerror=()=>rej(new Error("โหลดตัวอ่าน PDF ไม่ได้"));document.head.appendChild(s);});}

async function pdfToImg(file,max){
 const lib=await loadPdfJs();
 const pdf=await lib.getDocument({data:await file.arrayBuffer()}).promise;
 const pg=await pdf.getPage(1);let vp=pg.getViewport({scale:1});
 vp=pg.getViewport({scale:Math.min(max/vp.width,max/vp.height,3)});
 const c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;
 await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
 return c.toDataURL("image/jpeg",.8);}

 DB.floors=flr.docs.map(d=>({id:d.id,...d.data()}));

 DB.depts=dp.docs.map(d=>({id:d.id,...d.data()}));

 DB.assets=as.docs.map(d=>({id:d.id,...d.data()}));
 DB.users=us.docs.map(d=>({id:d.id,...d.data()}));
 const pm=await dbf.collection("perms").get();
 DB.perms={};pm.docs.forEach(d=>DB.perms[d.id]=d.data());
 normalizePerms();
 const lg=await dbf.collection("logs").orderBy("t","desc").limit(500).get();
 DB.logs=lg.docs.map(d=>({id:d.id,...d.data()}));}

function normalizePerms(src){
 const role=PT||"viewer";
 const mergeRole=(r,base)=>{
  const def=DEFAULT_PERMS[r]||{};const srcRole=base||{};
  const out={...def};
  Object.keys(def).forEach(k=>{if(k==="pages")return;out[k]={...(def[k]||{}),...(srcRole[k]||{})};});
  out.pages=Object.assign({},DEFAULT_PAGE_PERMS[r]||{},srcRole.pages||{});
  return out;
 };
 if(src&&src!==DB.perms&&typeof src==="object"&&!Array.isArray(src))return mergeRole(role,src);
 const all=src&&typeof src==="object"&&!Array.isArray(src)?src:DB.perms;
 Object.keys(DEFAULT_PERMS).forEach(r=>{DB.perms[r]=mergeRole(r,all?.[r]||{});});
 return DB.perms;
}

function attachListeners(){
 const cols=[["managements","managements"],["buildings","buildings"],["floors","floors"],["rooms","rooms"],["depts","depts"],
  ["cats","cats"],["assets","assets"],["users","users"],["perms","perms"]];
 cols.forEach(([col,key])=>{
  const unsub=dbf.collection(col).onSnapshot(snap=>{
   if(key==="perms"){const obj={};snap.forEach(d=>obj[d.id]=d.data());DB.perms=obj;normalizePerms();}
   else if(key==="cats")DB.cats=snap.docs.map(d=>({id:d.id,code:d.id,...d.data()}));
   else DB[key]=snap.docs.map(d=>({id:d.id,...d.data()}));
   scheduleRerender();
  },err=>console.error(col,err));
  UNSUBS.push(unsub);});
 const unsubLog=dbf.collection("logs").orderBy("t","desc").limit(500).onSnapshot(snap=>{
  DB.logs=snap.docs.map(d=>({id:d.id,...d.data()}));scheduleRerender();});
 UNSUBS.push(unsubLog);}

function detachListeners(){UNSUBS.forEach(u=>u());UNSUBS=[];}
function scheduleRerender(){clearTimeout(rerenderTimer);rerenderTimer=setTimeout(()=>{if(ME)go(TAB);},200);}

const RL=()=>ME.role;
const isSuper=()=>RL()==="superadmin";
function inB(bid){return isSuper()||!ME.scopeB||!ME.scopeB.length||ME.scopeB.includes(bid);}
function inF(fid){return isSuper()||!ME.scopeF||!ME.scopeF.length||ME.scopeF.includes(fid);}
function inC(c){return isSuper()||!ME.scopeC||!ME.scopeC.length||ME.scopeC.includes(c);}
function pv(res,act){const p=DB.perms[ME.role];return !!(p&&p[res]&&p[res][act]);}
function canBld(id,act){return pv("bld",act)&&inB(id);}
function canFlrP(f,act){return pv("flr",act)&&inB(f.bid);}
function canRoomP(r,act){return pv("room",act)&&inB(r.bid)&&inF(r.fid);}
function canAsset(room,cat,act){return (pv("room",act)&&inB(room.bid)&&inF(room.fid))||(pv("cat",act)&&inC(cat));}
function canPin(f){return pv("room","e")&&inB(f.bid)&&inF(f.id);}
function canDept(){return isSuper()||RL()==="bldadmin";}
function canAnyMaster(){return ["a","e","d"].some(x=>pv("bld",x)||pv("flr",x)||pv("room",x)||pv("cat",x))||canDept();}
function visRooms(){return DB.rooms.filter(r=>canRoomP(r,"v"));}
function visAssets(){return DB.assets.filter(a=>{const r=RM(a.room);return r.id&&canAsset(r,a.cat,"v");});}

function mBld(){mbox.innerHTML=`<div class="card"><b>อาคาร</b><button class="btn btn-sm" style="float:right" onclick="bldForm()">+ เพิ่ม</button><table style="margin-top:10px"><tr><th>รหัส</th><th>ชื่อ</th><th></th></tr>${DB.buildings.map(b=>`<tr><td>${esc(b.code)}</td><td><b>${esc(b.name)}</b></td><td><button class="btn-s btn-sm" onclick="bldForm('${b.id}')">แก้</button></td></tr>`).join("")}</table></div>`;}
function bldForm(id){const b=id?B(id):{code:"",name:""};mo(`<h3>อาคาร</h3><div class="row g2"><div class="fld"><label>รหัส</label><input id="b_code" value="${esc(b.code)}"></div><div class="fld"><label>ชื่อ</label><input id="b_name" value="${esc(b.name)}"></div></div><div style="text-align:right"><button class="btn-s" onclick="mc()">ยกเลิก</button><button class="btn" onclick="saveBld('${id||""}')">บันทึก</button></div>`);}
async function saveBld(id){const code=b_code.value.trim(),name=b_name.value.trim();if(!code||!name)return;const managementId=DB.managements[0]?.id||"";if(id)await dbf.collection("buildings").doc(id).set({code,name,managementId},{merge:true});else await dbf.collection("buildings").add({code,name,managementId,plan:"",img:""});mc();vMaster();}
function mFlr(){mbox.innerHTML=`<div class="card"><b>ชั้น</b><table style="margin-top:10px"><tr><th>ชั้น</th><th>ชื่อชั้น</th></tr>${DB.floors.map(f=>`<tr><td>${esc(f.no)}</td><td><b>${esc(f.name)}</b></td></tr>`).join("")}</table></div>`;}
function mRm(){mbox.innerHTML=`<div class="card"><b>ห้อง</b><table style="margin-top:10px"><tr><th>รหัส</th><th>ชื่อห้อง</th></tr>${DB.rooms.map(r=>`<tr><td>${esc(r.code)}</td><td><b>${esc(r.name)}</b></td></tr>`).join("")}</table></div>`;}
function mDept(){mbox.innerHTML=`<div class="card"><b>หน่วยงาน</b><button class="btn btn-sm" style="float:right" onclick="deptForm()">+ เพิ่ม</button><table style="margin-top:10px"><tr><th>ชื่อ</th></tr>${DB.depts.map(d=>`<tr><td><b>${esc(d.name)}</b></td></tr>`).join("")}</table></div>`;}
function deptForm(){mo(`<h3>หน่วยงาน</h3><div class="fld"><label>ชื่อ</label><input id="d_n"></div><div style="text-align:right"><button class="btn-s" onclick="mc()">ยกเลิก</button><button class="btn" onclick="saveDept()">บันทึก</button></div>`);}
async function saveDept(){const name=d_n.value.trim();if(!name)return;await dbf.collection("depts").add({name,head:"-",tel:"-"});mc();vMaster();}
function mCat(){mbox.innerHTML=`<div class="card"><b>หมวดครุภัณฑ์</b><table style="margin-top:10px"><tr><th>รหัส</th><th>ชื่อหมวด</th></tr>${DB.cats.map(c=>`<tr><td>${esc(c.code)}</td><td><b>${esc(c.name)}</b></td></tr>`).join("")}</table></div>`;}
function mAsset(){mbox.innerHTML=`<div class="card"><b>ครุภัณฑ์ทั้งหมด</b><table style="margin-top:10px"><tr><th>เลข</th><th>รายการ</th></tr>${DB.assets.map(a=>`<tr><td>${esc(a.no)}</td><td><b>${esc(a.name)}</b></td></tr>`).join("")}</table></div>`;}

function vPrint(){view.innerHTML=`<div class="card"><h3>Export / พิมพ์รายงาน</h3><button class="btn" onclick="window.print()">🖨️ สั่งพิมพ์ A4</button></div>`;}
function vLog(){view.innerHTML=`<div class="card"><h3>ประวัติการใช้งาน</h3><table>${DB.logs.map(l=>`<tr><td>${l.act}</td><td>${l.detail}</td></tr>`).join("")}</table></div>`;}
function vUser(){view.innerHTML=`<div class="card"><h3>ผู้ใช้งาน</h3><table>${DB.users.map(u=>`<tr><td>${u.em}</td><td>${u.role}</td></tr>`).join("")}</table></div>`;}
function vPerm(){view.innerHTML=`<div class="card"><h3>สิทธิ์การเข้าถึง</h3></div>`;}
function vData(){view.innerHTML=`<div class="card"><h3>นำเข้าข้อมูล</h3><input type="file" onchange="processExcelUpload(this)"></div>`;}

async function processExcelUpload(el){
 const f=el.files?.[0];if(!f)return;
 try{const wb=await readExcelFile(f);await importWorkbook(wb);alert("นำเข้าสำเร็จ");}catch(e){alert("ผิดพลาด: "+e.message);}
}
function readExcelFile(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(XLSX.read(new Uint8Array(e.target.result),{type:"array"}));r.readAsArrayBuffer(file);});}
async function importWorkbook(wb){
 const ws=wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
 for(const row of rows.slice(1)){if(!row[1])continue;await dbf.collection("assets").add({room:DB.rooms[0]?.id||"",cat:String(row[5]||"10"),name:String(row[1]),no:String(row[0]),qty:1,price:0,status:"ใช้งานปกติ",img:"",pdf:null});}
 loadAllOnce();
}

function mo(h){DIRTY=false;modal.innerHTML=`<div class="modal" onclick="if(event.target===this)mc()"><div class="box">${h}</div></div>`;}
function mc(){modal.innerHTML="";}
</script>
</body>
</html>
