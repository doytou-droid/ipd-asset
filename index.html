<style>

@media print{
  html,body{background:#fff !important;margin:0 !important;padding:0 !important;overflow:visible !important}
  body *{box-shadow:none !important}
  header,nav,#sidePanel,#modal,.noprint{display:none !important}
  #app{display:block !important}
  main{padding:0 !important;max-width:none !important;margin:0 !important;overflow:visible !important}
  #view{padding:0 !important;margin:0 !important;overflow:visible !important}
  #a4box{display:block !important;width:100% !important;max-height:none !important;overflow:visible !important;margin:0 !important;padding:0 !important}
  .a4sheet{width:100% !important;min-height:0 !important;margin:0 !important;padding:0 !important;box-shadow:none !important;border:0 !important;border-radius:0 !important;page-break-after:always;overflow:visible !important;display:block !important}
  .a4sheet.portrait,.a4sheet.landscape{min-height:0 !important}
  .a4sheet table{width:100% !important}.a4sheet thead{display:table-header-group}.a4sheet tr{break-inside:avoid;page-break-inside:avoid}
  .footer-page{position:static !important;margin:8mm 0 0 !important;padding-top:3mm !important;border-top:1px solid #cbd5e1 !important;break-inside:avoid;page-break-inside:avoid;display:flex !important}
  .export-group{break-after:avoid;page-break-after:avoid}
  @page{size:A4 portrait;margin:10mm}
}

/* ===== ปรับปรุง Dashboard / Location / Export / Import ===== */
.dash-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:6px 0 14px}.dash-head h2{font-size:20px;color:#0f2d6b;margin:0}.dash-head p{font-size:12px;color:#64748b;margin-top:4px}

function shrink(file,max=1280,q=.72){return new Promise((res,rej)=>{
 const r=new FileReader();r.onerror=()=>rej(new Error("อ่านไฟล์ไม่ได้"));
 r.onload=e=>{const im=new Image();
  im.onerror=()=>rej(new Error("เปิดไฟล์ภาพนี้ไม่ได้"));
  im.onload=()=>{let w=im.width,h=im.height;
   if(w>max||h>max){const s=Math.min(max/w,max/h);w=Math.round(w*s);h=Math.round(h*s);}
   const c=document.createElement("canvas");c.width=w;c.height=h;
   c.getContext("2d").drawImage(im,0,0,w,h);res(c.toDataURL("image/jpeg",q));};
  im.src=e.target.result;};
 r.readAsDataURL(file);});}
function readAs(file){return new Promise((res,rej)=>{const r=new FileReader();
 r.onerror=()=>rej(new Error("อ่านไฟล์ไม่ได้"));r.onload=e=>res(e.target.result);r.readAsDataURL(file);});}
function loadPdfJs(){return new Promise((res,rej)=>{
 if(window.pdfjsLib)return res(window.pdfjsLib);
 const s=document.createElement("script");
 s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
 s.onload=()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc=
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";res(window.pdfjsLib);};
 s.onerror=()=>rej(new Error("โหลดตัวอ่าน PDF ไม่ได้"));document.head.appendChild(s);});}
async function pdfToImg(file,max){
 const lib=await loadPdfJs();
 const pdf=await lib.getDocument({data:await file.arrayBuffer()}).promise;
 const pg=await pdf.getPage(1);let vp=pg.getViewport({scale:1});
 vp=pg.getViewport({scale:Math.min(max/vp.width,max/vp.height,3)});
 const c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;
 await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
 return c.toDataURL("image/jpeg",.8);}

function normalizePerms(src){
 const role=PT||"viewer";
 const mergeRole=(r,base)=>{
  const def=DEFAULT_PERMS[r]||{};const srcRole=base||{};
  const out={...def};
  Object.keys(def).forEach(k=>{
   if(k==="pages")return;
   out[k]={...(def[k]||{}),...(srcRole[k]||{})};
  });
  out.pages=Object.assign({},DEFAULT_PAGE_PERMS[r]||{},srcRole.pages||{});
  return out;
 };
 if(src&&src!==DB.perms&&typeof src==="object"&&!Array.isArray(src))return mergeRole(role,src);
 const all=src&&typeof src==="object"&&!Array.isArray(src)?src:DB.perms;
 Object.keys(DEFAULT_PERMS).forEach(r=>{DB.perms[r]=mergeRole(r,all?.[r]||{});});
 return DB.perms;
}

  ["cats","cats"],["assets","assets"],["users","users"],["perms","perms"]];
 cols.forEach(([col,key])=>{
  const unsub=dbf.collection(col).onSnapshot(snap=>{
   if(key==="perms"){const obj={};snap.forEach(d=>obj[d.id]=d.data());DB.perms=obj;normalizePerms();}
   else if(key==="cats")DB.cats=snap.docs.map(d=>({id:d.id,code:d.id,...d.data()}));
   else DB[key]=snap.docs.map(d=>({id:d.id,...d.data()}));
   scheduleRerender();
  },err=>console.error(col,err));
  UNSUBS.push(unsub);});
 const unsubLog=dbf.collection("logs").orderBy("t","desc").limit(500).onSnapshot(snap=>{
  DB.logs=snap.docs.map(d=>({id:d.id,...d.data()}));scheduleRerender();});
 UNSUBS.push(unsubLog);}
function detachListeners(){UNSUBS.forEach(u=>u());UNSUBS=[];}
function scheduleRerender(){clearTimeout(rerenderTimer);rerenderTimer=setTimeout(()=>{if(ME)go(TAB);},200);}

/* ============================================================
   ส่วนที่ 5 : สิทธิ์การใช้งาน
   ============================================================ */
const RL=()=>ME.role;
const isSuper=()=>RL()==="superadmin";
function inB(bid){return isSuper()||!ME.scopeB||!ME.scopeB.length||ME.scopeB.includes(bid);}
function inF(fid){return isSuper()||!ME.scopeF||!ME.scopeF.length||ME.scopeF.includes(fid);}
function inC(c){return isSuper()||!ME.scopeC||!ME.scopeC.length||ME.scopeC.includes(c);}
function pv(res,act){const p=DB.perms[ME.role];return !!(p&&p[res]&&p[res][act]);}
function canBld(id,act){return pv("bld",act)&&inB(id);}
function canFlrP(f,act){return pv("flr",act)&&inB(f.bid);}
function canRoomP(r,act){return pv("room",act)&&inB(r.bid)&&inF(r.fid);}
function canAsset(room,cat,act){return (pv("room",act)&&inB(room.bid)&&inF(room.fid))||(pv("cat",act)&&inC(cat));}
function canAddAsset(r){return (pv("room","a")&&inB(r.bid)&&inF(r.fid))||pv("cat","a");}
function canPin(f){return pv("room","e")&&inB(f.bid)&&inF(f.id);}
function canDept(){return isSuper()||RL()==="bldadmin";}
function canAnyMaster(){return ["a","e","d"].some(x=>pv("bld",x)||pv("flr",x)||pv("room",x)||pv("cat",x))||canDept();}
function visRooms(){return DB.rooms.filter(r=>canRoomP(r,"v"));}
function visAssets(){return DB.assets.filter(a=>{const r=RM(a.room);return r.id&&canAsset(r,a.cat,"v");});}

let DF={m:"",d:"",b:"",f:"",r:"",c:"",s:"",q:"",d1:"",d2:""};
function naturalSort(a,b){return String(a||"").localeCompare(String(b||""),"th",{numeric:true,sensitivity:"base"});}
function sortedDepts(){return DB.depts.slice().sort((a,b)=>naturalSort(a.name,b.name));}
function sortedBuildings(list=DB.buildings){return list.slice().sort((a,b)=>naturalSort((a.code||"")+" "+(a.name||""),(b.code||"")+" "+(b.name||"")));}
function sortedFloors(list=DB.floors){return list.slice().sort((a,b)=>naturalSort(a.no,b.no)||naturalSort(a.name,b.name));}
function sortedRooms(list=DB.rooms){return list.slice().sort((a,b)=>naturalSort((a.code||"")+" "+(a.name||""),(b.code||"")+" "+(b.name||"")));}
function deptBuildingOptions(deptId){const ids=new Set(DB.rooms.filter(r=>!deptId||r.dept===deptId).map(r=>r.bid));return sortedBuildings(DB.buildings.filter(b=>ids.has(b.id)&&inB(b.id)));}
function deptFloorOptions(deptId,bid){return sortedFloors(DB.floors.filter(f=>f.bid===bid&&inF(f.id)&&DB.rooms.some(r=>r.fid===f.id&&(!deptId||r.dept===deptId))));}
function deptRoomOptions(deptId,bid,fid){return sortedRooms(visRooms().filter(r=>(!deptId||r.dept===deptId)&&(!bid||r.bid===bid)&&(!fid||r.fid===fid)));}

async function upBldImg(id,key){
 const file=await pickFile(true);if(!file)return;
 try{toast("กำลังประมวลผล...");
  const dataUrl=file.type==="application/pdf"?await pdfToImg(file,1800):await shrink(file,1800,.78);
  await dbf.collection("buildings").doc(id).set({[key]:dataUrl},{merge:true});toast("อัปโหลดสำเร็จ");}
 catch(e){alert("อัปโหลดไม่สำเร็จ: "+e.message);}}
async function upFloorImg(id,key){
 const file=await pickFile(true);if(!file)return;
 try{toast("กำลังประมวลผล...");
  const dataUrl=file.type==="application/pdf"?await pdfToImg(file,1800):await shrink(file,1800,.78);
  await dbf.collection("floors").doc(id).set({[key]:dataUrl},{merge:true});toast("อัปโหลดสำเร็จ");}
 catch(e){alert("อัปโหลดไม่สำเร็จ: "+e.message);}}
async function clickPlan(e){
 if(!PL.pin)return;
 if(!PL.room)return alert("กรุณาเลือกห้องที่จะปักหมุดจากช่องด้านบนก่อนครับ");
 const img=document.querySelector("#pw img");if(!img)return;
 const w=img.getBoundingClientRect();
 let x=((e.clientX-w.left)/w.width)*100,y=((e.clientY-w.top)/w.height)*100;
 x=Math.max(0,Math.min(100,x));y=Math.max(0,Math.min(100,y));
 const roomId=PL.room;
 try{await dbf.collection("rooms").doc(roomId).set({x:+x.toFixed(2),y:+y.toFixed(2)},{merge:true});
  const nx=DB.rooms.filter(z=>z.fid===PL.fid).find(z=>z.x==null);
  PL.room=nx?nx.id:"";vPlan();toast(nx?"บันทึกแล้ว":"ปักหมุดครบทุกห้องแล้ว");}
 catch(err){alert("บันทึกไม่สำเร็จ: "+err.message);}}
async function rmPin(id){
 try{await dbf.collection("rooms").doc(id).set({x:null,y:null},{merge:true});vPlan();toast("ลบหมุดแล้ว");}
 catch(e){alert("ลบไม่สำเร็จ");}}
function sidePeek(roomId){if(SIDE_PINNED)return;clearTimeout(SIDE_TIMER);renderSide(roomId);document.getElementById("sidePanel").classList.add("open");}
function sideLeaveMaybe(){if(SIDE_PINNED)return;SIDE_TIMER=setTimeout(()=>{document.getElementById("sidePanel").classList.remove("open");},300);}
function sidePin(roomId){SIDE_PINNED=true;renderSide(roomId);document.getElementById("sidePanel").classList.add("open");}
function toggleSidePanel(){const el=document.getElementById("sidePanel");if(el.classList.contains("open")){el.classList.remove("open");SIDE_PINNED=false;}else el.classList.add("open");}
function closeSidePanel(){const el=document.getElementById("sidePanel");if(el)el.classList.remove("open");SIDE_PINNED=false;}

    ${a.img?`<img src="${esc(a.img)}" style="width:32px;height:32px;object-fit:cover;border-radius:4px;flex-shrink:0">`:'<div style="width:32px;height:32px;background:#e2e8f0;border-radius:4px;flex-shrink:0"></div>'}

   <button class="btn-s btn-sm" onclick="printRoom('${r.id}')">Export A4</button></div>`;}

 fl.innerHTML=bs.map(b=>{

   const rms=DB.rooms.filter(r=>r.fid===f.id&&(!DF.d||r.dept===DF.d)&&canRoomP(r,"v"));
   let cnt=0;

   <th>จน.</th><th>ราคา</th><th>วันที่ซื้อ</th><th>สถานะ</th><th class="noprint"></th></tr>
  ${rows.map(({a,r})=>`<tr><td><input type="checkbox" class="chk-assets" value="${a.id}"></td>
   <td>${a.img?`<img class="thumb" src="${esc(a.img)}" onclick="viewAssetImg('${a.id}')">`:"—"}</td>
   <td>${esc(a.no)}</td><td><b>${esc(a.name)}</b></td><td><span class="chip">${esc(a.cat)}</span></td>
   <td>${esc(B(r.bid).code)} / ${esc(FL(r.fid).no)} / ${esc(r.name)}</td>
   <td>${esc(a.brand)} ${esc(a.model)}</td><td>${a.qty||1}</td><td style="text-align:right">${money(a.price)}</td>
   <td>${esc(a.buy)}</td><td><span class="chip ${a.status==="ใช้งานปกติ"?"g":a.status==="ชำรุด"?"r":"y"}">${esc(a.status)}</span></td>
   <td class="noprint" style="white-space:nowrap"><button class="btn-s btn-sm" onclick="assetView('${a.id}')">ดู</button>

   ${!rows.length?'<tr><td colspan="12" style="color:#94a3b8;text-align:center">ไม่พบรายการ</td></tr>':""}</table></div>`;
}

function toggleAll(el,cls){document.querySelectorAll(".chk-"+cls).forEach(c=>c.checked=el.checked);}
async function bulkDel(col){
 const ids=[...document.querySelectorAll(".chk-"+col+":checked")].map(c=>c.value);
 if(!ids.length)return alert("กรุณาเลือกรายการที่ต้องการลบ");
 if(!confirm("ยืนยันลบ "+ids.length+" รายการที่เลือก?"))return;
 try{toast("กำลังลบ...");
  for(const id of ids)await dbf.collection(col).doc(id).delete();
  toast("ลบสำเร็จ");vMaster();
 }catch(e){alert("ลบไม่สำเร็จ (อาจมีข้อมูลลูกใช้งานอยู่): "+e.message);}}

function syncExportColsFromUI(){
 EXPORT_FIELDS.forEach(f=>{const el=document.getElementById("c_"+f.key);if(el)EXPORT_COLS[f.key]=!!el.checked;});
}
function setExportOrientation(v){syncExportColsFromUI();EXPORT_ORIENT=v||"portrait";vPrint();}
function setExportView(v){syncExportColsFromUI();EX_VIEW=v||"room";vPrint();}
function moveExportCol(key,dir){
 syncExportColsFromUI();const i=EXPORT_ORDER.indexOf(key),j=i+dir;
 if(i<0||j<0||j>=EXPORT_ORDER.length)return;
 [EXPORT_ORDER[i],EXPORT_ORDER[j]]=[EXPORT_ORDER[j],EXPORT_ORDER[i]];vPrint();

function readExcelFile(file){
 return new Promise((resolve,reject)=>{
  const r=new FileReader();r.onerror=()=>reject(new Error("อ่านไฟล์ไม่ได้"));
  r.onload=e=>{
   try{
    const data=new Uint8Array(e.target.result);
    const wb=XLSX.read(data,{type:"array",cellDates:false});
    resolve(wb);
   }catch(err){reject(err);}
  };
  r.readAsArrayBuffer(file);
 });
}
function sheetToObjects(ws){
 const raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
 if(!raw.length)return [];
 const headers=raw[0].map(x=>String(x).trim());
 return raw.slice(1).filter(row=>row.some(v=>String(v??"").trim()!=="")).map(row=>{
  const o={};headers.forEach((h,i)=>o[h]=String(row[i]??"").trim());return o;
 });
}
function findDeptByName(name){return DB.depts.find(d=>d.name===name);}
function findBuildingByCode(code){return DB.buildings.find(b=>b.code===code);}
function findFloorByCodeNo(bid,no){return DB.floors.find(f=>f.bid===bid&&String(f.no)===String(no));}
function findRoomByKey(bid,no,code){
 const f=findFloorByCodeNo(bid,no);return f?DB.rooms.find(r=>r.fid===f.id&&r.code===code):null;
}
async function writeBatchOps(ops){
 for(let i=0;i<ops.length;i+=450){
  const batch=dbf.batch();
  ops.slice(i,i+450).forEach(op=>{
   const ref=op.id?dbf.collection(op.col).doc(op.id):dbf.collection(op.col).doc();
   if(!op.id)op.id=ref.id;
   if(op.mode==="delete")batch.delete(ref);else batch.set(ref,op.data,{merge:op.mode==="set"});
  });
  await batch.commit();
 }
}
async function importWorkbook(wb){
 let total=0,errors=[];
 const ordered=["managements","depts","cats","buildings","floors","rooms","assets"];
 for(const kind of ordered){
  const def=DATA_IMPORT_DEFS.find(x=>x[0]===kind);
  if(!def)continue;
  const sheetName=wb.SheetNames.find(n=>n===def[1]);
  if(!sheetName)continue;
  const rows=sheetToObjects(wb.Sheets[sheetName]),ops=[];
  try{
   if(kind==="managements")rows.forEach(x=>{const name=x["ชื่อส่วนบริหาร"];if(!name)return;const old=DB.managements.find(m=>m.name===name);ops.push({col:"managements",id:old?.id,data:{name,note:x["หมายเหตุ"]||""},mode:old?"set":"add"});});
   if(kind==="depts")rows.forEach(x=>{const name=x["ชื่อหน่วยงาน"];if(!name)return;const old=findDeptByName(name);ops.push({col:"depts",id:old?.id,data:{name,head:x["หัวหน้า"]||"-",tel:x["เบอร์ติดต่อ"]||"-"},mode:old?"set":"add"});});
   if(kind==="cats")rows.forEach(x=>{const code=x["รหัสหมวด"];if(!code)return;ops.push({col:"cats",id:code,data:{name:x["ชื่อหมวด"]||"",note:x["หมายเหตุ"]||"",sys:true},mode:"set"});});
   if(kind==="buildings")rows.forEach(x=>{
    const mg=DB.managements.find(m=>m.name===x["รหัสส่วนบริหาร/ชื่อส่วนบริหาร"]||m.id===x["รหัสส่วนบริหาร/ชื่อส่วนบริหาร"]);
    if(!x["รหัสอาคาร"])return;
    if(!mg){errors.push(`อาคาร ${x["รหัสอาคาร"]}: ไม่พบส่วนบริหาร`);return;}
    const old=DB.buildings.find(b=>b.code===x["รหัสอาคาร"]&&b.managementId===mg.id);
    ops.push({col:"buildings",id:old?.id,data:{managementId:mg.id,code:x["รหัสอาคาร"],name:x["ชื่ออาคาร"]||"",area:x["พื้นที่ใช้สอย"]||"",beds:x["จำนวนเตียง"]||"",note:x["หมายเหตุ"]||""},mode:old?"set":"add"});
   });
   if(kind==="floors")rows.forEach(x=>{
    const b=findBuildingByCode(x["รหัสอาคาร"]);
    if(!b||!x["ชั้นที่"]){errors.push(`ชั้น ${x["รหัสอาคาร"]}/${x["ชั้นที่"]}: ไม่พบอาคาร`);return;}
    const old=findFloorByCodeNo(b.id,x["ชั้นที่"]);
    ops.push({col:"floors",id:old?.id,data:{bid:b.id,no:x["ชั้นที่"],name:x["ชื่อชั้น"]||`ชั้น ${x["ชั้นที่"]}`,dept:findDeptByName(x["หน่วยงานหลัก"])?.id||""},mode:old?"set":"add"});
   });
   if(kind==="rooms")rows.forEach(x=>{
    const b=findBuildingByCode(x["รหัสอาคาร"]),f=b&&findFloorByCodeNo(b.id,x["ชั้นที่"]);
    if(!b||!f||!x["รหัสห้อง"]){errors.push(`ห้อง ${x["รหัสอาคาร"]}/${x["ชั้นที่"]}/${x["รหัสห้อง"]}: ตรวจสอบอาคาร/ชั้น`);return;}
    const old=DB.rooms.find(r=>r.fid===f.id&&r.code===x["รหัสห้อง"]),dept=findDeptByName(x["หน่วยงาน"]);
    ops.push({col:"rooms",id:old?.id,data:{bid:b.id,fid:f.id,code:x["รหัสห้อง"],name:x["ชื่อห้อง"]||"",dept:dept?.id||"",owner:x["ผู้รับผิดชอบ"]||"-",tel:x["เบอร์ภายใน"]||""},mode:old?"set":"add"});
   });
   if(kind==="assets")rows.forEach(x=>{
    if(!x["ชื่อครุภัณฑ์"])return;
    const room=findRoomByKey(x["รหัสอาคาร"],x["ชั้นที่"],x["รหัสห้อง"]),cat=CT(x["รหัสหมวด"]),dept=findDeptByName(x["หน่วยงานผู้รับผิดชอบ"]);
    if(!room||!cat.id){errors.push(`ครุภัณฑ์ ${x["เลขครุภัณฑ์"]||x["ชื่อครุภัณฑ์"]}: ไม่พบห้องหรือหมวด`);return;}
    const old=x["เลขครุภัณฑ์"]?DB.assets.find(a=>a.no===x["เลขครุภัณฑ์"]):null;
    const data={room:room.id,cat:cat.code,name:x["ชื่อครุภัณฑ์"],no:x["เลขครุภัณฑ์"]||"",sn:x["Serial Number"]||"",qty:+x["จำนวน"]||1,brand:x["ยี่ห้อ"]||"",model:x["รุ่น"]||"",price:+String(x["ราคาต่อหน่วย"]||"").replace(/,/g,"")||0,vendor:x["ผู้ขาย"]||"",buy:safeDate(x["วันที่ซื้อ"]),war:safeDate(x["วันหมดประกัน"]),rdept:dept?.id||room.dept,status:x["สถานะ"]||"ใช้งานปกติ",budget:x["งบประมาณ"]||"",spec:x["คุณลักษณะเฉพาะ"]||"",note:x["หมายเหตุ"]||""};
    if(old){if(old.img)data.img=old.img;if(old.pdf)data.pdf=old.pdf;}
    else{data.img="";data.pdf=null;data.created=new Date().toISOString();data.by=ME.em;}
    ops.push({col:"assets",id:old?.id,data,mode:old?"set":"add"});
   });
   await writeBatchOps(ops);
   total+=ops.length;
   if(ops.length){await loadAllOnce();}
  }catch(e){errors.push(`${def[1]}:${e.message}`);}
 }
 log("import","นำเข้าข้อมูล Excel รวม "+total+" รายการ"+(errors.length?" / ข้อผิดพลาด "+errors.length+" รายการ":""));
 if(errors.length)console.warn("รายละเอียดข้อผิดพลาดจากการนำเข้า",errors);
 alert(`นำเข้าเสร็จสิ้น ${total} รายการ`+(errors.length?`\nพบข้อผิดพลาด ${errors.length} รายการ (รายละเอียดอยู่ใน Console)`:``));
 go("dash");
}
async function processExcelUpload(el){
 const f=el.files?.[0];if(!f)return;
 try{toast("กำลังอ่านไฟล์ Excel...");
  const wb=await readExcelFile(f);await importWorkbook(wb);
 }catch(e){alert("นำเข้าไม่สำเร็จ: "+e.message);}
 el.value="";
}
